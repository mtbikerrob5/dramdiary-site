<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Catalog Review — Admin · Dram Diary</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2"/>
  <style>
    :root {
      --bg: #1a1a1a; --bg-deep: #262626; --bg-elev: #2e2e2e;
      --cream: #f5e6d3; --cream-dim: #a8957a;
      --border: #3a3a3a; --border-light: #4a4a4a;
      --gold: #c19a4a; --gold-dim: #8b6f30;
      --teal: #4c948e; --teal-dim: #2a5754;
      --slate: #2e4057;
      --red: #c0392b; --red-dim: #7b1f1f;
      --green: #27ae60; --green-dim: #1a6b3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 4px; color: var(--cream); }
    .subtitle { color: var(--cream-dim); font-size: 14px; margin-bottom: 32px; }

    /* ── Login screen ── */
    .login-card {
      max-width: 400px; margin: 100px auto;
      background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px;
    }
    .login-card h2 { margin-bottom: 8px; }
    .login-card p { color: var(--cream-dim); font-size: 13px; margin-bottom: 20px; }

    /* ── Form/inputs ── */
    label {
      display: block; font-size: 11px; letter-spacing: 1.2px;
      color: var(--cream-dim); text-transform: uppercase; margin-bottom: 6px; margin-top: 14px;
    }
    input[type=text], input[type=password], input[type=number], input[type=date], input[type=search], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 12px; color: var(--cream); font-size: 14px;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--gold);
    }
    textarea { resize: vertical; min-height: 60px; }
    .code-input {
      font-family: "Menlo", monospace; letter-spacing: 1px; text-transform: uppercase;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-block; background: var(--gold); color: #000;
      border: none; padding: 11px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; text-transform: uppercase;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: #d8af5a; }
    .btn-secondary {
      background: transparent; color: var(--cream); border: 1px solid var(--border-light);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-elev); border-color: var(--cream-dim); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { background: #d04a3a; }
    .btn-teal { background: var(--teal); color: white; }
    .btn-teal:hover:not(:disabled) { background: #5aa9a2; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }

    /* ── Cards/sections ── */
    .card {
      background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 24px;
    }
    .card h2 {
      font-size: 14px; letter-spacing: 1.5px; color: var(--gold);
      text-transform: uppercase; margin-bottom: 16px; font-weight: 600;
    }

    /* ── Form layout ── */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; flex-wrap: wrap; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 10px 8px; font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--cream-dim); font-size: 10px; letter-spacing: 1.2px;
      text-transform: uppercase; font-weight: 600;
    }
    tr:last-child td { border-bottom: none; }
    .code-cell { font-family: "Menlo", monospace; color: var(--gold); }
    .muted { color: var(--cream-dim); }
    .badge {
      display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px;
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-active { background: var(--green-dim); color: #7ad99c; }
    .badge-disabled { background: var(--red-dim); color: #f5a89e; }
    .badge-expired { background: var(--bg-elev); color: var(--cream-dim); }
    .badge-exhausted { background: var(--gold-dim); color: var(--cream); }
    .badge-hi { background: var(--green-dim); color: #7ad99c; }
    .badge-mid { background: var(--gold-dim); color: var(--cream); }
    .badge-lo { background: var(--bg-elev); color: var(--cream-dim); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--bg-deep); border: 1px solid var(--gold);
      padding: 14px 18px; border-radius: 8px; font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4); max-width: 320px; z-index: 50;
      animation: slideUp 0.2s ease-out;
    }
    .toast.error { border-color: var(--red); color: #f5a89e; }
    .toast.success { border-color: var(--green); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 10px 16px; font-size: 13px; cursor: pointer;
      color: var(--cream-dim); border-bottom: 2px solid transparent;
      letter-spacing: 0.5px;
    }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab:hover { color: var(--cream); }

    .empty-state {
      padding: 32px 16px; text-align: center; color: var(--cream-dim); font-size: 13px;
    }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .help-text { color: var(--cream-dim); font-size: 11px; margin-top: 4px; line-height: 1.4; }

    /* ── Page header ── */
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .page-head .subtitle { margin-bottom: 8px; }
    .head-links { display: flex; gap: 14px; align-items: center; font-size: 12px; padding-top: 8px; }
    .head-links a { color: var(--cream-dim); text-decoration: none; letter-spacing: 0.5px; }
    .head-links a:hover { color: var(--gold); }
    .stats-line { font-size: 14px; color: var(--cream); margin-bottom: 20px; }
    .stats-line strong { color: var(--gold); }

    /* ── Batch filter chips ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 999px; padding: 7px 14px; font-size: 12px; color: var(--cream-dim);
      cursor: pointer; user-select: none; max-width: 100%;
    }
    .chip:hover { border-color: var(--cream-dim); color: var(--cream); }
    .chip.active { border-color: var(--gold); color: var(--gold); background: rgba(193,154,74,0.08); }
    .chip .chip-count {
      background: var(--bg-elev); color: var(--cream); font-size: 10px; font-weight: 700;
      padding: 1px 7px; border-radius: 999px;
    }
    .chip.active .chip-count { background: var(--gold); color: #000; }
    .chip .chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Pending item cards ── */
    .item { transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.35s ease; }
    .item.removing { opacity: 0; transform: translateY(-6px); pointer-events: none; }
    .item-top { display: flex; gap: 18px; align-items: flex-start; }
    .item-thumb {
      width: 72px; height: 96px; flex-shrink: 0; border-radius: 8px;
      background: var(--bg-elev); border: 1px solid var(--border); object-fit: cover;
    }
    .item-thumb.placeholder {
      display: flex; align-items: center; justify-content: center;
      color: var(--cream-dim); font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    }
    .item-fields { flex: 1; min-width: 0; }
    .item-fields label { margin-top: 10px; }
    .item-fields label:first-child { margin-top: 0; }
    .field-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .dis-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .dis-head h2 { margin: 0; }
    .dis-head .muted { font-size: 12px; }
    .dis-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
    .dis-row:first-of-type { border-top: 0; }
    .dis-name { font-weight: 600; color: var(--cream); }
    .dis-sub { font-size: 12px; color: var(--cream-dim); margin-top: 2px; }
    .dis-sub b { color: var(--gold); }
    .dis-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 720px) { .dis-row { grid-template-columns: 1fr; } .dis-actions { justify-content: flex-start; } }
    .field-grid label { margin-top: 10px; }
    .item-meta { font-size: 12px; color: var(--cream-dim); margin-top: 12px; line-height: 1.6; }
    .item-meta b { color: var(--cream); font-weight: 600; }
    .item-meta .sep { margin: 0 6px; opacity: 0.6; }

    .matches { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
    .matches h3 {
      font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--cream-dim); font-weight: 600; margin-bottom: 8px;
    }
    .cand {
      display: flex; align-items: center; gap: 12px; padding: 9px 10px;
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
      background: var(--bg);
    }
    .cand-body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; }
    .cand-body .cand-name { color: var(--cream); font-weight: 600; }
    .cand-body .cand-name .badge { margin-left: 6px; font-size: 10px; vertical-align: middle; }
    .cand-family { border-color: var(--gold); }
    .merge-panel { border: 1px solid var(--teal); border-radius: 8px; padding: 12px; margin: 4px 0 10px; background: var(--bg); }
    .merge-head { font-size: 13px; color: var(--cream); margin-bottom: 8px; }
    .merge-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
    .merge-table th { text-align: left; font-size: 10px; letter-spacing: 1px; color: var(--cream-dim); font-weight: 600; padding: 4px 8px; }
    .merge-table td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
    .merge-table td label { cursor: pointer; }
    .merge-table td input { margin-right: 6px; }
    .merge-label { color: var(--cream-dim); width: 110px; }
    .merge-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .cand-body .cand-sub { color: var(--cream-dim); font-size: 12px; }
    .cand-thumb { width: 32px; height: 42px; border-radius: 4px; object-fit: cover; background: var(--bg-elev); flex-shrink: 0; }
    .cand .badge { flex-shrink: 0; }
    .cand-empty { font-size: 12px; color: var(--cream-dim); padding: 6px 0 4px; }
    .search-wrap { margin-top: 10px; position: relative; }
    .search-wrap input { padding-left: 34px; }
    .search-wrap::before {
      content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--cream-dim); font-size: 16px; pointer-events: none;
    }
    .search-results { margin-top: 8px; }
    .search-status { font-size: 12px; color: var(--cream-dim); padding: 6px 0; }

    @media (max-width: 760px) {
      body { padding: 14px; }
      .field-grid { grid-template-columns: 1fr 1fr; }
      .item-top { flex-direction: column; }
      .item-thumb { width: 60px; height: 80px; }
      .cand { flex-wrap: wrap; }
      .cand .btn { width: 100%; text-align: center; }
      .form-actions .btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <!-- Login screen -->
  <div id="login" class="container">
    <div class="login-card">
      <h2>Admin Sign-In</h2>
      <p>Enter the admin password to review pending catalog entries.</p>
      <form id="login-form" onsubmit="return false">
        <label for="pwd">Password</label>
        <input type="password" id="pwd" autocomplete="current-password" autofocus>
        <div style="margin-top: 16px;">
          <button type="submit" class="btn" id="login-btn">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="container" style="display: none;">
    <div class="page-head">
      <div>
        <h1>Catalog Review</h1>
        <p class="subtitle">Approve, edit, merge or reject bottles submitted by users and collection imports.</p>
      </div>
      <div class="head-links">
        <a href="/admin/promo-codes.html">Promo Codes</a>
        <a href="#" id="refresh-link">Refresh</a>
        <a href="#" id="signout-link">Sign out</a>
      </div>
    </div>

    <p class="stats-line" id="stats-line">Loading…</p>

    <div class="chips" id="chips"></div>

    <div id="disagreements"></div>

    <div id="items"></div>
  </div>

  <div id="toast-host"></div>

  <script>
    // ─── Configuration ─────────────────────────────────────────────────
    const FUNCTION_URL = 'https://okxuvrrcpvzchzoictsf.supabase.co/functions/v1/admin-catalog-review';
    // Anonymous Supabase API key — required by the Supabase HTTP gateway, but the
    // function itself enforces auth via the admin token.
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9reHV2cnJjcHZ6Y2h6b2ljdHNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTU2MTAsImV4cCI6MjA4ODc3MTYxMH0.tQhWE2maV4eJLPoIlHYZW_lZzhgr5JX65jhK3R8zRmg';

    const TYPE_OPTIONS = [
      ['bourbon', 'Bourbon'],
      ['rye', 'Rye'],
      ['tennessee', 'Tennessee'],
      ['american_single_malt', 'American Single Malt'],
      ['american_blend', 'American Blend'],
      ['wheat', 'Wheat Whiskey'],
      ['corn', 'Corn Whiskey'],
      ['scotch_single_malt', 'Scotch Single Malt'],
      ['scotch_blended', 'Scotch Blended'],
      ['irish', 'Irish'],
      ['japanese', 'Japanese'],
      ['canadian', 'Canadian'],
      ['other', 'Other'],
    ];
    const TYPE_LABEL = Object.fromEntries(TYPE_OPTIONS);

    // ─── Token storage (shared with promo-codes.html) ──────────────────
    const TOKEN_KEY = 'dd_admin_token';
    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    // ─── API helper ────────────────────────────────────────────────────
    async function api(action, payload = {}) {
      const body = { action, ...payload };
      const token = getToken();
      if (token && action !== 'auth') body.token = token;

      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + ANON_KEY,
        },
        body: JSON.stringify(body),
      });
      let data = {};
      try { data = await res.json(); } catch (_) { data = {}; }
      if (!data.ok) {
        if (res.status === 401 && action !== 'auth') {
          // Token expired — drop to login
          clearToken();
          showLogin();
        }
        throw new Error(data.error || ('Request failed (' + res.status + ')'));
      }
      return data;
    }

    // ─── Toast ─────────────────────────────────────────────────────────
    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = 'toast ' + (type === 'error' ? 'error' : 'success');
      el.textContent = msg;
      document.getElementById('toast-host').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    // ─── HTML escaping ─────────────────────────────────────────────────
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // Only allow http(s) URLs into src attributes.
    function safeUrl(u) {
      if (!u) return '';
      const s = String(u).trim();
      return /^https?:\/\//i.test(s) ? esc(s) : '';
    }

    // ─── State ─────────────────────────────────────────────────────────
    const state = {
      items: [],          // pending items currently rendered
      itemsById: {},      // bottle_id → item
      batches: [],        // [{id, filename, user, created_at, pending_count}]
      batchId: null,      // active batch filter (null = all)
      pendingTotal: 0,
      pendingImport: 0,
      candById: {},       // candidate id → candidate object (matches + search results)
      disagreements: [],  // rows from v_proof_disagreements
      disAll: false,      // false = 2+ users only
    };

    // ─── Login flow ────────────────────────────────────────────────────
    function showLogin() {
      document.getElementById('login').style.display = '';
      document.getElementById('app').style.display = 'none';
    }
    function showApp() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = '';
    }

    document.getElementById('login-form').addEventListener('submit', async () => {
      const pwd = document.getElementById('pwd').value.trim();
      if (!pwd) return;
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const res = await api('auth', { password: pwd });
        setToken(res.token);
        document.getElementById('pwd').value = '';
        showApp();
        loadAll();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });

    document.getElementById('signout-link').addEventListener('click', (e) => {
      e.preventDefault();
      clearToken();
      showLogin();
      toast('Signed out');
    });
    document.getElementById('refresh-link').addEventListener('click', (e) => {
      e.preventDefault();
      loadAll();
    });

    // ─── Loading ───────────────────────────────────────────────────────
    async function loadAll() {
      const wrap = document.getElementById('items');
      wrap.innerHTML = '<div class="empty-state">Loading…</div>';
      try {
        const payload = state.batchId ? { batch_id: state.batchId } : {};
        const [stats, list, dis] = await Promise.all([
          api('stats').catch(() => null),
          api('list_pending', payload),
          api('list_proof_disagreements', { min_users: state.disAll ? 1 : 2 }).catch(() => null),
        ]);
        state.disagreements = dis && Array.isArray(dis.items) ? dis.items : [];
        renderDisagreements();
        if (stats) {
          state.pendingTotal = Number(stats.pending_total) || 0;
          state.pendingImport = Number(stats.pending_import) || 0;
          if (Array.isArray(stats.batches) && !state.batchId) state.batches = stats.batches;
        }
        // list_pending's batches are authoritative when present (unfiltered) —
        // when filtered the server may still return the full list, so only
        // overwrite if it gives us at least as many as we already know about.
        if (Array.isArray(list.batches) && (!state.batchId || list.batches.length >= state.batches.length)) {
          state.batches = list.batches;
        }
        // If the batch from ?batch= doesn't exist any more, drop the filter.
        if (state.batchId && state.batches.length && !state.batches.some(b => String(b.id) === String(state.batchId))) {
          state.batchId = null;
        }
        state.items = Array.isArray(list.items) ? list.items : [];
        state.itemsById = {};
        state.items.forEach(it => { state.itemsById[bottleOf(it).id] = it; });
        if (!stats) {
          // Fall back to counting what we can see.
          state.pendingTotal = state.items.length;
          state.pendingImport = state.items.filter(it => it.batch).length;
        }
        renderStats();
        renderChips();
        renderItems();
      } catch (e) {
        wrap.innerHTML = `<div class="empty-state">Could not load pending entries: ${esc(e.message)}</div>`;
      }
    }

    function bottleOf(item) { return item.bottle || {}; }

    // ─── Proof disagreements ───────────────────────────────────────────
    // Users whose bottle proof differs from a fixed-proof catalog row. Nothing here is
    // blocking anyone: their bottles already carry their own proof. This is the digest
    // that replaces per-bottle review for proof mismatches.
    function renderDisagreements() {
      const el = document.getElementById('disagreements');
      const rows = state.disagreements || [];
      const toggle = `<a href="#" id="dis-toggle" class="muted">${state.disAll ? 'show 2+ users only' : 'show single reports too'}</a>`;
      if (!rows.length) {
        el.innerHTML = `<div class="card"><div class="dis-head"><h2>Proof disagreements</h2>${toggle}</div>
          <div class="muted">No fixed-proof bottles have ${state.disAll ? 'any' : 'multiple'} owners reporting a different proof.</div></div>`;
        return;
      }
      el.innerHTML = `<div class="card"><div class="dis-head"><h2>Proof disagreements</h2>${toggle}</div>
        ${rows.map(r => `<div class="dis-row" data-bottle="${esc(r.bottle_id)}" data-observed="${esc(r.observed_proof)}">
          <div>
            <div class="dis-name">${esc(r.name)}${r.distillery ? ` <span class="muted">· ${esc(r.distillery)}</span>` : ''}</div>
            <div class="dis-sub">catalog <b>${r.catalog_proof ?? '—'}°</b> · reported <b>${r.observed_proof}°</b> by <b>${r.user_count}</b> ${r.user_count === 1 ? 'user' : 'users'}${r.batch_number ? ` · batch <b>${esc(r.batch_number)}</b>` : ''} · ${r.owner_count} owner${r.owner_count === 1 ? '' : 's'} · ${esc(r.proof_policy)} · last ${esc(fmtDate(r.last_seen))}</div>
          </div>
          <div class="dis-actions">
            ${r.proof_policy === 'batched' && r.batch_number
              ? `<button class="btn btn-sm" data-dis="create_batch" data-label="${esc(r.batch_number)}" title="Adds ${esc(r.batch_number)} as a batch under ${esc(r.name)} at ${r.observed_proof}° and moves the owners who typed that batch onto it">Create batch ${esc(r.batch_number)} at ${r.observed_proof}°</button>`
              : `<button class="btn btn-sm" data-dis="accept" title="Catalog proof becomes ${r.observed_proof}° and untouched owner snapshots follow">Set catalog to ${r.observed_proof}°</button>`}
            <button class="btn btn-sm btn-teal" data-dis="variable" title="Proof varies by batch or barrel; stop tracking disagreements for this bottle">Mark variable</button>
            <button class="btn btn-sm btn-secondary" data-dis="dismiss" title="Drop this report; owners keep their own proof">Dismiss</button>
          </div>
        </div>`).join('')}
      </div>`;
    }

    document.getElementById('disagreements').addEventListener('click', async (e) => {
      const t = e.target.closest('#dis-toggle');
      if (t) { e.preventDefault(); state.disAll = !state.disAll; loadAll(); return; }
      const btn = e.target.closest('[data-dis]');
      if (!btn) return;
      const row = btn.closest('.dis-row');
      const bottle_id = row.dataset.bottle, observed_proof = row.dataset.observed, resolution = btn.dataset.dis;
      if (resolution === 'accept' && !confirm(`Set the catalog proof to ${observed_proof}°? Owners who still hold the old catalog value will be updated.`)) return;
      row.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        if (resolution === 'create_batch') {
          const res = await api('create_batch', { parent_id: bottle_id, batch_label: btn.dataset.label, proof: observed_proof });
          toast(`${res.created ? 'Created' : 'Already existed:'} batch ${res.batch_label}` + (res.repointed ? ` · ${res.repointed} owner${res.repointed === 1 ? '' : 's'} moved` : ''));
        } else {
          await api('resolve_proof', { bottle_id, observed_proof, resolution });
          toast(resolution === 'accept' ? 'Catalog proof updated' : resolution === 'variable' ? 'Marked variable' : 'Dismissed');
        }
        state.disagreements = (state.disagreements || []).filter(r => (resolution === 'dismiss' || resolution === 'create_batch')
          ? !(String(r.bottle_id) === bottle_id && String(r.observed_proof) === observed_proof)
          : String(r.bottle_id) !== bottle_id);
        renderDisagreements();
      } catch (err) {
        toast(err.message || 'Failed', 'error');
        row.querySelectorAll('button').forEach(b => b.disabled = false);
      }
    });

    // ─── Header stats ──────────────────────────────────────────────────
    function renderStats() {
      const el = document.getElementById('stats-line');
      const n = state.pendingTotal, m = state.pendingImport;
      let html = `<strong>${n}</strong> pending catalog ${n === 1 ? 'entry' : 'entries'} · <strong>${m}</strong> from imports`;
      if (state.batchId) {
        const b = state.batches.find(x => String(x.id) === String(state.batchId));
        html += ` <span class="muted">· showing import “${esc(b ? b.filename : state.batchId)}”</span>`;
      }
      el.innerHTML = html;
    }

    // ─── Batch chips ───────────────────────────────────────────────────
    function batchUser(b) {
      if (!b) return '';
      if (typeof b.user === 'string') return b.user;
      if (b.user && typeof b.user === 'object') return b.user.username || b.user.display_name || '';
      return b.username || '';
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return '—';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderChips() {
      const wrap = document.getElementById('chips');
      const all = `<div class="chip ${state.batchId ? '' : 'active'}" data-batch="">
          <span class="chip-text">All</span>
          <span class="chip-count">${state.pendingTotal}</span>
        </div>`;
      const rest = state.batches.map(b => {
        const u = batchUser(b);
        const text = [esc(b.filename || 'import'), u ? '@' + esc(u) : null, esc(fmtDate(b.created_at))].filter(Boolean).join(' · ');
        return `<div class="chip ${String(state.batchId) === String(b.id) ? 'active' : ''}" data-batch="${esc(b.id)}" title="${text}">
            <span class="chip-text">${text}</span>
            <span class="chip-count">${Number(b.pending_count) || 0}</span>
          </div>`;
      }).join('');
      wrap.innerHTML = all + rest;
    }

    document.getElementById('chips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const id = chip.dataset.batch || null;
      if (id === state.batchId) return;
      state.batchId = id;
      const url = new URL(location.href);
      if (id) url.searchParams.set('batch', id); else url.searchParams.delete('batch');
      history.replaceState(null, '', url);
      loadAll();
    });

    // ─── Item cards ────────────────────────────────────────────────────
    function scoreBadge(score) {
      const pct = Math.round((Number(score) || 0) * 100);
      const cls = pct >= 85 ? 'badge-hi' : pct >= 50 ? 'badge-mid' : 'badge-lo';
      return `<span class="badge ${cls}">${pct}% match</span>`;
    }

    function candidateRow(c, showScore = true) {
      state.candById[c.id] = c;
      const img = safeUrl(c.image_url);
      const sub = [
        c.distillery ? esc(c.distillery) : null,
        (c.proof !== null && c.proof !== undefined && c.proof !== '') ? esc(c.proof) + ' proof' : null,
        (c.age_statement !== null && c.age_statement !== undefined && c.age_statement !== '') ? esc(c.age_statement) + ' yr' : null,
        c.type ? esc(TYPE_LABEL[c.type] || c.type) : null,
      ].filter(Boolean).join(' · ');
      // Batch families: the parent reads "Stagg (batch family · 15 batches)", a child reads
      // "Stagg · Batch 23A", so it is obvious whether a merge lands on the family or one batch.
      let nameHtml = esc(c.name || '(unnamed)');
      let tag = '';
      if (c.is_family) {
        tag = `<span class="badge badge-mid">batch family${c.batch_count ? ' · ' + c.batch_count + ' batches' : ''}</span>`;
      } else if (c.batch_label) {
        nameHtml = `${esc(c.parent_name || c.name)} <span class="muted">·</span> Batch ${esc(c.batch_label)}`;
        tag = `<span class="badge badge-lo">batch</span>`;
      }
      const mergeLabel = c.is_family ? 'Merge into family' : c.batch_label ? `Merge into batch ${esc(c.batch_label)}` : 'Merge into this';
      return `<div class="cand${c.is_family ? ' cand-family' : ''}" data-cand-id="${esc(c.id)}">
          ${img ? `<img class="cand-thumb" src="${img}" alt="" loading="lazy">` : ''}
          <div class="cand-body">
            <div class="cand-name">${nameHtml} ${tag}</div>
            <div class="cand-sub">${sub || '<span class="muted">no details</span>'}</div>
          </div>
          ${showScore && c.score !== undefined && c.score !== null ? scoreBadge(c.score) : ''}
          <button class="btn btn-teal btn-sm" data-action="merge" data-target="${esc(c.id)}">${mergeLabel}</button>
        </div>`;
    }

    // fixed: one proof for the release. variable: cask strength / barrel proof / picks, the user's
    // proof lives on their bottle and never needs review. batched: curated child rows per batch.
    function policySelect(current) {
      const opts = [['fixed', 'Fixed proof'], ['variable', 'Varies by batch / barrel'], ['batched', 'Curated batches']];
      return `<select class="f-policy">${opts.map(([v, l]) => `<option value="${v}"${(current || 'fixed') === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
    }

    function typeSelect(current) {
      const cur = current || 'bourbon';
      const opts = TYPE_OPTIONS.map(([k, label]) =>
        `<option value="${k}" ${k === cur ? 'selected' : ''}>${label}</option>`).join('');
      // Keep unknown types visible rather than silently changing them.
      const extra = TYPE_LABEL[cur] ? '' : `<option value="${esc(cur)}" selected>${esc(cur)}</option>`;
      return `<select class="f-type">${opts}${extra}</select>`;
    }

    function renderItems() {
      const wrap = document.getElementById('items');
      if (!state.items.length) {
        wrap.innerHTML = '<div class="card"><div class="empty-state">Nothing pending — nice work.</div></div>';
        return;
      }
      wrap.innerHTML = state.items.map(renderItem).join('');
    }

    function renderItem(item) {
      const b = bottleOf(item);
      const id = b.id;
      const img = safeUrl(b.image_url);
      const submitter = item.submitter && (item.submitter.username || item.submitter.display_name);
      const owners = Number(item.owners) || 0;
      const cands = Array.isArray(item.candidates) ? item.candidates.slice(0, 3) : [];
      const age = b.age_statement ?? b.age ?? '';
      const year = b.vintage_year ?? b.release_year ?? '';

      const meta = [
        submitter ? `submitted by <b>@${esc(submitter)}</b>` : `submitted by <b>unknown</b>`,
        `owners: <b>${owners}</b>`,
        item.batch ? `from import <b>“${esc(item.batch.filename || 'import')}”</b>${item.batch.created_at ? ' · ' + esc(fmtDate(item.batch.created_at)) : ''}` : null,
        b.created_at ? `added ${esc(fmtDate(b.created_at))}` : null,
      ].filter(Boolean).join('<span class="sep">·</span>');

      return `<div class="card item" data-id="${esc(id)}">
        <div class="item-top">
          ${img
            ? `<img class="item-thumb" src="${img}" alt="" loading="lazy">`
            : `<div class="item-thumb placeholder">no image</div>`}
          <div class="item-fields">
            <label>Bottle name</label>
            <input type="text" class="f-name" value="${esc(b.name)}" placeholder="Bottle / expression name">
            <label>Distillery</label>
            <input type="text" class="f-distillery" value="${esc(b.distillery)}" placeholder="Producer / brand">
            <div class="field-grid">
              <div>
                <label>Type</label>
                ${typeSelect(b.type)}
              </div>
              <div>
                <label>Proof</label>
                <input type="number" class="f-proof" step="0.1" min="1" max="200" value="${esc(b.proof ?? '')}" placeholder="—">
              </div>
              <div>
                <label>Age (yrs)</label>
                <input type="number" class="f-age" step="1" min="0" max="100" value="${esc(age)}" placeholder="NAS">
              </div>
              <div>
                <label>Release year</label>
                <input type="number" class="f-year" step="1" min="1800" max="2100" value="${esc(year)}" placeholder="—">
              </div>
              <div>
                <label>Proof policy</label>
                ${policySelect(b.proof_policy)}
              </div>
            </div>
            <label>UPC</label>
            <input type="text" class="f-upc" inputmode="numeric" value="${esc(b.upc)}" placeholder="digits only">
            <div class="item-meta">${meta}</div>
          </div>
        </div>

        <div class="matches">
          <h3>Possible matches</h3>
          <div class="cand-list">
            ${cands.length ? cands.map(c => candidateRow(c, true)).join('') : '<div class="cand-empty">No close matches in the catalog.</div>'}
          </div>
          <div class="search-wrap">
            <input type="search" class="f-search" placeholder="search catalog…" autocomplete="off">
          </div>
          <div class="search-results"></div>
        </div>

        <div class="form-actions">
          <button class="btn" data-action="approve">Approve</button>
          <button class="btn btn-danger" data-action="reject">Reject</button>
        </div>
      </div>`;
    }

    // ─── Card interactions (event delegation) ──────────────────────────
    const itemsEl = document.getElementById('items');

    itemsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const card = btn.closest('.item');
      if (!card) return;
      const id = card.dataset.id;
      const action = btn.dataset.action;
      if (action === 'approve') approveItem(id, card, btn);
      else if (action === 'reject') rejectItem(id, card, btn);
      else if (action === 'merge') openMergePanel(id, card, btn.dataset.target, btn);
      else if (action === 'merge-confirm') mergeItem(id, card, btn.dataset.target, btn, collectMergeChoices(btn.closest('.merge-panel')));
      else if (action === 'merge-cancel') btn.closest('.merge-panel').remove();
    });

    // ─── Merge with field choices ──────────────────────────────────────
    // Quick merge keeps the catalog values. The panel lists every field where the
    // submission (as currently edited on the card) differs from the catalog row and
    // lets you pick which side wins; chosen submission values are sent as `backfill`
    // and overwrite the catalog on merge (proof corrections propagate to owners).
    const MERGE_FIELDS = [
      ['name', 'Name', v => v],
      ['distillery', 'Distillery', v => v],
      ['type', 'Type', v => TYPE_LABEL[v] || v],
      ['proof', 'Proof', v => v],
      ['age_statement', 'Age', v => v == null || v === '' ? 'NAS' : v + ' yr'],
      ['vintage_year', 'Release year', v => v],
      ['upc', 'UPC', v => v],
    ];
    const blank = v => v === null || v === undefined || v === '';
    const same = (a, b) => (blank(a) && blank(b)) || String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

    function openMergePanel(id, card, targetId, btn) {
      if (!targetId) return;
      if (String(targetId) === String(id)) { toast('Cannot merge a bottle into itself', 'error'); return; }
      const cand = state.candById[targetId] || {};
      const pending = readEdits(card);
      card.querySelectorAll('.merge-panel').forEach(p => p.remove());
      const diffs = MERGE_FIELDS.filter(([k]) => !same(cand[k], pending[k]) && !blank(pending[k]));
      const row = btn.closest('.cand');
      const targetName = cand.is_family ? `${cand.name} (batch family)` : cand.batch_label ? `${cand.parent_name || cand.name} · Batch ${cand.batch_label}` : (cand.name || 'catalog entry');
      const panel = document.createElement('div');
      panel.className = 'merge-panel';
      panel.dataset.target = targetId;
      if (!diffs.length) {
        panel.innerHTML = `<div class="merge-head">Merge into <b>${esc(targetName)}</b></div>
          <div class="muted" style="margin:6px 0 10px">Every field already matches the catalog. Owners are re-pointed and an alias is saved.</div>
          <div class="merge-actions"><button class="btn btn-teal btn-sm" data-action="merge-confirm" data-target="${esc(targetId)}">Merge</button>
          <button class="btn btn-secondary btn-sm" data-action="merge-cancel">Cancel</button></div>`;
      } else {
        panel.innerHTML = `<div class="merge-head">Merge into <b>${esc(targetName)}</b> <span class="muted">· choose what the catalog keeps</span></div>
          <table class="merge-table"><thead><tr><th></th><th>Catalog</th><th>Submission</th></tr></thead><tbody>
          ${diffs.map(([k, label, fmt]) => {
            const cv = cand[k], pv = pending[k];
            const catalogEmpty = blank(cv);
            return `<tr data-field="${k}">
              <td class="merge-label">${label}</td>
              <td><label><input type="radio" name="m-${esc(id)}-${k}" value="catalog" ${catalogEmpty ? '' : 'checked'} ${catalogEmpty ? 'disabled' : ''}> ${catalogEmpty ? '<span class="muted">empty</span>' : esc(fmt(cv))}</label></td>
              <td><label><input type="radio" name="m-${esc(id)}-${k}" value="submission" ${catalogEmpty ? 'checked' : ''}> ${esc(fmt(pv))}</label></td>
            </tr>`;
          }).join('')}
          </tbody></table>
          <div class="merge-actions">
            <button class="btn btn-teal btn-sm" data-action="merge-confirm" data-target="${esc(targetId)}">Merge with selections</button>
            <button class="btn btn-sm" data-action="merge-confirm" data-target="${esc(targetId)}" data-quick="1">Quick merge (keep catalog)</button>
            <button class="btn btn-secondary btn-sm" data-action="merge-cancel">Cancel</button>
          </div>`;
      }
      (row || card.querySelector('.matches')).insertAdjacentElement('afterend', panel);
      panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function collectMergeChoices(panel) {
      if (!panel) return {};
      const card = panel.closest('.item');
      const pending = readEdits(card);
      const backfill = {};
      panel.querySelectorAll('tr[data-field]').forEach(tr => {
        const k = tr.dataset.field;
        const pick = tr.querySelector('input[type=radio]:checked')?.value;
        if (pick === 'submission' && !blank(pending[k])) backfill[k] = pending[k];
      });
      return backfill;
    }

    itemsEl.addEventListener('input', (e) => {
      if (!e.target.classList.contains('f-search')) return;
      const card = e.target.closest('.item');
      scheduleSearch(card, e.target.value);
    });

    function numOrNull(v) {
      if (v === '' || v === null || v === undefined) return null;
      const n = Number(v);
      return isNaN(n) ? null : n;
    }

    function readEdits(card) {
      const name = card.querySelector('.f-name').value.trim();
      const distillery = card.querySelector('.f-distillery').value.trim();
      const type = card.querySelector('.f-type').value;
      const proof = numOrNull(card.querySelector('.f-proof').value);
      const age_statement = numOrNull(card.querySelector('.f-age').value);
      const vintage_year = numOrNull(card.querySelector('.f-year').value);
      const upc = card.querySelector('.f-upc').value.replace(/\D+/g, '') || null;
      const proof_policy = card.querySelector('.f-policy') ? card.querySelector('.f-policy').value : undefined;
      return { name, distillery: distillery || null, type, proof, age_statement, vintage_year, upc, proof_policy };
    }

    function setBusy(card, busy) {
      card.querySelectorAll('button, input, select').forEach(el => { el.disabled = busy; });
    }

    async function approveItem(id, card, btn) {
      const edits = readEdits(card);
      if (!edits.name) { toast('Name is required', 'error'); return; }
      const label = btn.textContent;
      setBusy(card, true); btn.textContent = 'Approving…';
      try {
        await api('approve', { bottle_id: id, edits });
        toast(`Approved “${edits.name}”`);
        removeCard(id, card);
      } catch (e) {
        toast(e.message, 'error');
        setBusy(card, false); btn.textContent = label;
      }
    }

    async function rejectItem(id, card, btn) {
      const item = state.itemsById[id] || {};
      const name = card.querySelector('.f-name').value.trim() || bottleOf(item).name || 'this bottle';
      const owners = Number(item.owners) || 0;
      const msg = owners > 0
        ? `Reject “${name}”?\n\n${owners} user${owners === 1 ? '' : 's'} own${owners === 1 ? 's' : ''} this bottle, so it will be SOFT-REJECTED: hidden from the public catalog and search, but their bottle stays in their collection.`
        : `Reject “${name}”?\n\nNobody owns this bottle, so it will be DELETED from the catalog permanently. (If someone did own it, it would only be soft-rejected / hidden.)`;
      if (!confirm(msg)) return;
      const label = btn.textContent;
      setBusy(card, true); btn.textContent = 'Rejecting…';
      try {
        await api('reject', { bottle_id: id });
        toast(owners > 0 ? `Soft-rejected “${name}”` : `Deleted “${name}”`);
        removeCard(id, card);
      } catch (e) {
        toast(e.message, 'error');
        setBusy(card, false); btn.textContent = label;
      }
    }

    async function mergeItem(id, card, targetId, btn, backfill = {}) {
      if (!targetId) return;
      if (btn.dataset.quick) backfill = {};
      const cand = state.candById[targetId] || {};
      const targetName = cand.name || 'catalog entry';
      if (String(targetId) === String(id)) { toast('Cannot merge a bottle into itself', 'error'); return; }
      const label = btn.textContent;
      setBusy(card, true); btn.textContent = 'Merging…';
      try {
        const res = await api('merge', { duplicate_id: id, canonical_id: targetId, backfill });
        const n = Number(res.repointed);
        toast(`Merged into “${targetName}”` + (isNaN(n) ? '' : ` · ${n} bottle${n === 1 ? '' : 's'} re-pointed`));
        removeCard(id, card);
      } catch (e) {
        toast(e.message, 'error');
        setBusy(card, false); btn.textContent = label;
      }
    }

    function removeCard(id, card) {
      const item = state.itemsById[id];
      // Update counts
      state.pendingTotal = Math.max(0, state.pendingTotal - 1);
      if (item && item.batch) {
        state.pendingImport = Math.max(0, state.pendingImport - 1);
        const b = state.batches.find(x => String(x.id) === String(item.batch.id));
        if (b) b.pending_count = Math.max(0, (Number(b.pending_count) || 0) - 1);
      }
      state.items = state.items.filter(it => String(bottleOf(it).id) !== String(id));
      delete state.itemsById[id];
      renderStats();
      renderChips();

      card.classList.add('removing');
      setTimeout(() => {
        card.remove();
        if (!state.items.length) renderItems();
      }, 360);
    }

    // ─── Catalog search (debounced per card) ───────────────────────────
    const searchTimers = new WeakMap();
    const searchSeq = new WeakMap();

    function scheduleSearch(card, q) {
      const results = card.querySelector('.search-results');
      const query = (q || '').trim();
      clearTimeout(searchTimers.get(card));
      if (query.length < 2) { results.innerHTML = ''; return; }
      results.innerHTML = '<div class="search-status">Searching…</div>';
      searchTimers.set(card, setTimeout(() => runSearch(card, query), 320));
    }

    async function runSearch(card, query) {
      const results = card.querySelector('.search-results');
      const seq = (searchSeq.get(card) || 0) + 1;
      searchSeq.set(card, seq);
      const selfId = card.dataset.id;
      try {
        const res = await api('search_catalog', { q: query });
        if (searchSeq.get(card) !== seq) return; // stale response
        const list = (Array.isArray(res.results) ? res.results : []).filter(r => String(r.id) !== String(selfId));
        if (!list.length) {
          results.innerHTML = `<div class="search-status">No catalog results for “${esc(query)}”.</div>`;
          return;
        }
        results.innerHTML = list.slice(0, 10).map(c => candidateRow(c, c.score !== undefined && c.score !== null)).join('');
      } catch (e) {
        if (searchSeq.get(card) !== seq) return;
        results.innerHTML = `<div class="search-status">Search failed: ${esc(e.message)}</div>`;
      }
    }

    // ─── Boot ──────────────────────────────────────────────────────────
    (function boot() {
      const qp = new URLSearchParams(location.search).get('batch');
      if (qp) state.batchId = qp;
      if (getToken()) {
        // Verify the token still works before showing the app
        api('stats').then(() => {
          showApp();
          loadAll();
        }).catch(() => {
          clearToken();
          showLogin();
        });
      } else {
        showLogin();
      }
    })();
  </script>
</body>
</html>
